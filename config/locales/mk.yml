    faq:
      title: "Најчесто поставувани прашања за изнајмување возило во Скопје"
      q1:
        question: "Дали ми е потребна меѓународна возачка дозвола за да изнајмам возило во Скопје?"
        answer: "Доколку вашата возачка дозвола не е од ЕУ или Велика Британија или не е напишана со латинични букви, многу компании за изнајмување возила во Северна Македонија бараат меѓународна возачка дозвола заедно со вашата домашна дозвола. Дури и кога не е строго задолжително, често се препорачува за туристите."
      q2:
        question: "Кои документи се потребни на шалтерот за изнајмување?"
        answer: "Обично ви треба важечка возачка дозвола, пасош или лична карта, и платежна картичка на име на возачот; во некои случаи, агентите за изнајмување може да побараат и детали за вашиот лет или локални контакт информации."
      q3:
        question: "Можам ли да резервирам изнајмување со враќање на возилото во друг град?"
        answer: "Да, изнајмувањата со враќање на друго место се дозволени на многу рути во Северна Македонија, со надоместок за враќање на друго место кој се плаќа при преземање; меѓународните изнајмувања со враќање на друго место се можни само на одредени рути и мора да се провери однапред."
      q4:
        question: "Дали е безбедно да возам изнајмено возило во центарот на Скопје?"
        answer: "Да, возењето е генерално безбедно доколку ги почитувате локалните закони, обрнувате внимание на другите возачи и ги избегнувате вршните часови; паркирањето може да биде ограничено во централните области, па користењето на хотелски или приватен паркинг е паметен избор."
      q5:
        question: "Што се случува доколку изнајменото возило се расипе?"
        answer: "Повеќето сериозни компании за изнајмување возила во Северна Македонија обезбедуваат 24/7 помош на пат и, доколку е потребно, замена на возилото во дефиниран временски рок, за да можете да го продолжите вашето патување со минимално задоцнување."
      q6:
        question: "Можат ли млади возачи да изнајмат возило во Скопје?"
        answer: "Политиките варираат, но многу компании за изнајмување бараат возачите да имаат најмалку 21 година и да имаат важечка возачка дозвола најмалку една или две години; некои може да наплатат надоместок за млад возач за изнајмувачи под одредена возраст."
      q7:
        question: "Дали се обезбедуваат зимски гуми и опрема кога е потребно?"
        answer: "Во зимските месеци, изнајмените возила во Северна Македонија обично се опремени со соодветни гуми и понекогаш дополнителна опрема како што бара локалниот закон; потврдете го ова со агентот за изнајмување кога го финализирате вашиот план за изнајмување."
      q8:
        question: "Можам ли да возам изнајмено возило надвор од Северна Македонија?"
        answer: "Прекуграничното патување зависи од договорот за изнајмување; некои компании дозволуваат со претходна најава и дополнителни надоместоци, додека други може да ограничат одредени земји, па затоа секогаш прашајте пред да ја преминете границата."
