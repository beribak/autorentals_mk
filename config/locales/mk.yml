      banner:
        title: "Управување со флота на возила"
        subtitle: "Сеопфатни услуги за управување со флота за бизниси од сите големини. Поедноставете ги вашите операции и намалете ги трошоците."
      faq:
        title: "Најчесто поставувани прашања"
        description: "Сè што треба да знаете за нашите услуги за управување со флота."
        q1:
          question: "Анализа на флота"
          answer: |
            Car Fleet Management d.o.o. као експерт во областа на управување со возни паркови на своите клиенти им нуди бесплатна советодавна служба со цел оптимизација на трошоците на возниот парк.

            <br><br>

            Во таа смисла, при иницијалниот контакт предлагаме следни чекори:

            <br><br>

            - Длабинска анализа на искористеноста и ефикасноста на постојниот возен парк.

            - Изработка на предлог за замена на возниот парк со приспособување на флотата на актуелните даночни закони поврзани со употреба на возила во деловни цели, како и идните законски прописи и директиви поврзани со користење на возила и намалување на штетната емисија во согласност со препораките и директивите на ЕУ.

            - Замена на амортизираниот возен парк со нов кој е приспособен на потребите на клиентот.

            <br><br>

            Оптимизација на економичноста и еколошките аспекти:

            <br><br>

            Преку селекција на модели според критериуми за пониска потрошувачка на гориво и намалена штетна емисија за потребите на "benefit флотата" (за возила доделени на вработените за користење 24 часа) – предлагаме:

            <br><br>

            - "Downsizing" на моторите со цел намалување на просечната потрошувачка на гориво

            - Избор на "еко" мотори со пониско ниво на CO2 емисија

            - Советување на компании при изработка на "Footprint – зелен отпечаток" & "CO2 emission" прописи за возниот парк на лесни комерцијални возила, вклучувајќи изработка на платформа за детална стратегија за воведување модели со ниско ниво на загадување и помала специфична потрошувачка на гориво ("green fleet", т.е. мотори со ниска емисија и ниски mpg параметри, воведување на хибриди, EV – електрични возила и сл.).

            <br><br>

            Во случај на потреба од замена на постојниот возен парк со нови возила, целосно ќе му помогнеме на клиентот полесно да ги продаде постојните возила по најдобрите цени на пазарот.
        q2:
          question: "Набавка на возила"
          answer: |
            Со целосно индивидуален аналитички пристап кон потребите и желбите на клиентите, како и многу добро познавање и увид во состојбата на пазарот на возила и придружните услуги, во договор со клиентот ги усогласуваме потребите со тековните услови на пазарот со цел постигнување на најдобар однос вложено/добиено, како и намалување на трошоците користејќи ги сите законски и даночни олеснувања или предности.

            <br><br>

            Поради обемот на набавката, во можност сме да обезбедиме најдобри комерцијални услови од добавувачите или увозниците на возила. Сите вака постигнати бенефиции во целост се пренесуваат на клиентот.

            <br><br>

            Преку низа различни анализи и користејќи богато долгогодишно искуство од областа на управување со флоти на возила и финансирање на истите, изработуваме посебно приспособени решенија со цел оптимизација на трошоците за експлоатација (т.н. TCO-трошок на вкупното сопственост) и максимално економично почитување на желбите и реалните потреби.

            <br><br>

            На клиентите исто така им нудиме можност за усогласување и рамнотежа на целта по основа на CO2 емисија и трошоците на флотата.

            <br><br>

            По завршување на анализата, клиентот добива оптимално формиран возен парк во смисла на однос на вкупниот трошок и техничко-функционалните потреби.
        q3:
          question: "Финансирање"
          answer: |
            Нашата услуга за управување со возен парк на компании е достапна за сите возила, без разлика дали се во сопственост на компаниите или се возила финансирани преку лизинг.

            <br><br>

            Во соработка со сите водечки финансиски куќи од областа на лизинг, во можност сме да понудиме целосно решение за финансирање на набавка на возила со моментално најповолни услови на пазарот.

            <br><br>

            На барање на клиентот, целосно можеме да го преземеме веќе започнатиот процес на преговори со финансиските институции во делот на финансирање на набавка на возила, и на тој начин можеме да обезбедиме најквалитетни услови на пазарот.
        q4:
          question: "Регистрација и осигурување"
          answer: |
            Целосно ја преземаме контролата на процесот на регистрација и осигурување на возила, како и редовните годишни обнови на истите.

            <br><br>

            Во соработка со водечките осигурителни друштва нудиме приспособени решенија и услови за осигурување со максимална оптимизација на трошоците. Го преземаме процесот на договарање и обнова на полиси за АО, КАСКО и осигурување на патници, како и зелена карта.

            <br><br>

            Предности што ги остварува клиентот:

            <br><br>

            - Повеќе не мора да се грижи околу договарање на полиси и обнова на осигурување. Сите возила се целосно осигурани за време на целиот период на траење на договорот.

            - Износот на осигурување на возилата е составен дел од месечниот трошок на услугата за управување со возниот парк.

            - Исто така, ја преземаме целосната грижа околу периодичните технички прегледи и исполнување на сите законски пропишани предуслови и документација потребна за испорака и почеток на користење на ново возило, за целиот период на траење на договорот.
        q5:
          question: "Испорака на возила"
          answer: |
            Вршиме целосна координација на процесот на испорака на возила, вклучувајќи подготовка на возилото со сите потребни документи и законски пропишана опрема.

            <br><br>

            На барање на клиентот, вршиме дополнителни услуги за опремување и/или осликување на возилата во согласност со корпоративните прописи на клиентот.

            <br><br>

            Клиентот при испораката на возилото добива целосно подготвено и опремено возило подготвено за моментална употреба и експлоатација.
        q6:
          question: "Одржување на возила"
          answer: |
            Целосно управуваме со сите процеси и настани кои се однесуваат на одржување на возилата, без разлика дали станува збор за редовно одржување или вонредни поправки на возилата, како и преземање на ризикот од сите непланирани трошоци по основа на одржување на возилата, а за тоа им обезбедуваме на клиентите однапред познати фиксни трошоци за одржување.

            <br><br>

            Услугата за управување со процесот на одржување на возилата вклучува сите трошоци за одржување на возилата, редовно и вонредно, како и сите потрошни материјали за време на периодот на експлоатација (кочни облоги, течности во моторот, потрошен материјал, метлички на бришачите и сл.), без оглед на нивната потребна количина во нормални услови на користење на возилото и за договорно определената километража.

            <br><br>

            Сите возила за време на целиот период на траење на договорот за одржување, се одржуваат исклучиво во овластени сервиси користејќи само оригинални резервни делови и материјали што ги препорачува самиот производител на возилото.

            <br><br>

            Нашиот експертски тим врши контрола на сите активности и трошоци за одржување на возилата, како редовно, така и вонредно одржување, со што се обезбедува целосна контрола на сите активности на возилото и нивната исправност и безбедност на употреба, а големиот обем на набавка обезбедува најконкурентни услови и цени на пазарот, што директно влијае на понизок трошок на пакетот за одржување. Нашиот стручен тим континуирано ја следи реално поминатата километража и консумацијата на сите услуги, како и во случај на индикација на отстапувања му дава на корисникот предлог за корекција на договорот за управување на начин што се усогласуваат договорните параметри и на тој начин се избегнуваат големи отстапувања по истекот на договорот.
        q7:
          question: "Управување со гуми"
          answer: |
            Услугата за управување со пневматици вклучува дополнителни пневматици, во однос на траењето на користење на возилото и договорната километража.

            <br><br>

            Услугата за управување со пневматици вклучува, освен пневматиците, сезонска замена, како и складирање на истите за време на периодот на користење на возилото.

            <br><br>

            Со нашиот советодавен пристап и користење на соодветни димензии и категории на пневматици можни се значителни заштеди во овој сегмент.
        q8:
          question: "Заменски возила"
          answer: |
            Услугата за заменско возило Ви обезбедува мобилност во секој момент со користење на заменско возило од однапред договорена категорија во случај на потреба од истото кај:

            <br><br>

            - Поголеми дефекти

            - Штети на возилото

            - Кражби и слични настани

            <br><br>

            Услугата се договара на определен број денови на користење на заменското возило за време на периодот.
        q9:
          question: "Помош на пат"
          answer: |
            Услугата за помош на пат, која е достапна 24 часа дневно со повик на бесплатен број, вклучува обезбедување на мобилност и помош во сите ситуации кога не сте во можност нормално да го користите Вашето возило покриено со нашите услуги.

            <br><br>

            Услугата за помош на пат е достапна во ист обем на покривање, без оглед на марката на возилото.

            <br><br>

            Услугата за помош на пат можно е да се договори и за сите држави на Европа (надвор од Северна Македонија повикот се остварува на посебен фиксен број, со соговорник кој зборува македонски, без оглед од која држава се врши повикот).
        q10:
          question: "Управување со штети"
          answer: |
            Целосно го преземаме комплетниот процес на обработка на штети на возилата:

            <br><br>

            - Обработка на штети со осигурителното друштво

            - Договарање на поправки на возилата со сервисите

            - Ликвидација на штети

            - Враќање на возилото на корисникот

            <br><br>

            За време на периодот на поправка на возилото ја обезбедуваме мобилноста на клиентот, односно корисникот на возилото преку услугата за заменско возило.
        q11:
          question: "VIP услуги"
          answer: |
            Нудиме посебно креирани и приспособени VIP услуги за клиенти:

            <br><br>

            "Door To Door" услуга

            <br><br>

            Услугата вклучува преземање и враќање на возилото во цел на извршување на работи на возилото (одржување, регистрација, пневматици и сл.)

            <br><br>

            Останати VIP услуги на барање

            <br><br>

            За нашите клиенти во можност сме да обезбедиме сите останати VIP услуги на барање со претходен договор.
        q12:
          question: "Кол центар"
          answer: |
            Сите наши клиенти можат во секој момент преку телефонски повик да добијат сите потребни информации поврзани со возилата и нашите услуги.

            <br><br>

            Повиците се системски забележуваат, така што е можно во секој момент да се добијат разни форми на извештаи за сите остварени барања и пријавени случаи – отворени и затворени, односно решени.

            <br><br>

            Преку кол центарот корисниците на возилата се во можност на пример да резервираат термин во сервис, да се договорат за замена на гуми, да бараат Door-To-Door услуга или да добијат информација за поединечните услуги вклучени во нивниот договор за управување.
        q13:
          question: "Редовно известување"
          answer: "На сите наши корисници стандардно им даваме услуга на редовно известување за состојбата на нивната флота, преку кои во секој момент имаат комплетен преглед и битни информации за нивната флота врз основа на кои можат да донесуваат важни одлуки во нивното работење."
        q14:
          question: "Онлајн кориснички портал"
          answer: |
            Сите наши клиенти добиваат пристап до нашиот онлајн кориснички центар каде можат во реално време да ги следат сите битни информации за својот возен парк:

            <br><br>

            - Прегледување детали на поединечните договори

            - Прегледување на сите поднесени барања преку кол центарот или преку онлајн сервисот

            - Креирање нови барања или случаи за решавање, како што се прашања за поединечни услуги, барања за доставување на податоци, пријавување штета или дефект на возилото и сл.

            - Прегледување на сите издадени сметки, понуди и сл.

            - Преземање низа однапред дефинирани извештаи за нивната флота
      cta:
        title: "Подготвени да ја оптимизирате вашата флота?"
        description: "Контактирајте не денес за да ги дискутираме вашите потреби за управување со флота и откриjте како можеме да помогнеме да ги поедноставите вашите операции."
        button: "Добијте понуда"
